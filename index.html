<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="quiz">
    <div class="page-screenshot" aria-hidden="true">
        <div class="page-screenshot-image"></div>
    </div>
    <main class="container" aria-busy="true">
        <div class="question-content">
            <h1 id="question-text" aria-live="polite">Loading your Valentine quiz...</h1>
            <div id="answer-buttons" class="buttons"></div>
        </div>
        <div class="gif_container">
            <img id="media" alt="" hidden>
            <div id="media-placeholder" role="img" style="text-align: center;" hidden></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
